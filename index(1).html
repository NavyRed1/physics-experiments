<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Balls Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrollbars */
            background-color: #1a1a1a; /* Dark background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block; /* Remove default inline padding */
            width: 100%;
            height: 100%;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .control-group {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 250px;
        }

        label {
            font-size: 14px;
        }

        input[type="range"] {
            width: 120px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }

        #stats {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="bouncingCanvas"></canvas>
        
        <div id="controls">
            <div class="control-group">
                <label for="ballCount">Ball Count:</label>
                <input type="range" id="ballCount" min="10" max="2000" value="500">
                <span id="ballCountDisplay">500</span>
            </div>
            <div class="control-group">
                <label for="gravity">Gravity:</label>
                <input type="range" id="gravity" min="0" max="3" step="0.05" value="0.5">
                <span id="gravityDisplay">0.5</span>
            </div>
             <div class="control-group">
                <label for="friction">Friction:</label>
                <input type="range" id="friction" min="0.8" max="1" step="0.01" value="0.99">
                <span id="frictionDisplay">0.99</span>
            </div>
            
            <div class="control-group" style="flex-direction: column; align-items: flex-start; gap: 5px;">
                <label for="themePrompt" style="font-weight: bold; color: #ffeb3b;">🎨 AI Color Theme</label>
                <input type="text" id="themePrompt" placeholder="e.g. 'neon cyberpunk' or 'autumn leaves'" style="width: 100%; padding: 5px; border-radius: 4px; border: none; background: #333; color: white;">
                <button id="themeBtn" style="background-color: #ff9800; margin-top: 5px;">Apply Theme</button>
            </div>

            <button id="poetryBtn" style="background-color: #03a9f4; margin-top: 10px;">📜 AI Poetry Mode</button>

            <button id="resetBtn">Reset Simulation</button>
            <button id="chaosBtn" style="background-color: #9c27b0; margin-top: 10px;">🎲 AI Chaos Mode</button>
            <div id="stats">FPS: <span id="fps">0</span></div>
            <div id="aiStatus" style="font-size: 12px; margin-top: 10px; color: #ffeb3b; text-align: center; display: none;">Contacting AI...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bouncingCanvas');
        const ctx = canvas.getContext('2d');
        let balls = [];
        let animationId;
        let lastTime = 0;
        let fpsCounter = document.getElementById('fps');
        let currentThemeColors = null; // Store custom theme colors if active
        let currentPoetry = null; // Store poetry to display

        // Simulation parameters
        let numBalls = parseInt(document.getElementById('ballCount').value);
        let gravity = parseFloat(document.getElementById('gravity').value);
        let friction = parseFloat(document.getElementById('friction').value);

        class Ball {
            constructor(x, y, radius, color, dx, dy) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.dx = dx; // Velocity in x direction
                this.dy = dy; // Velocity in y direction
                this.mass = radius; // Mass proportional to size
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
                
                // Optional: Add a little highlight for 3D effect
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fill();
                ctx.closePath();
            }

            update(canvasWidth, canvasHeight) {
                // Apply gravity
                this.dy += gravity;

                // Handle wall collisions (Left and Right)
                if (this.x + this.radius + this.dx > canvasWidth || this.x - this.radius + this.dx < 0) {
                    this.dx = -this.dx * friction;
                    // Keep ball within bounds to prevent sticking
                    if (this.x + this.radius >= canvasWidth) this.x = canvasWidth - this.radius;
                    if (this.x - this.radius <= 0) this.x = this.radius;
                }

                // Handle floor/ceiling collisions (Bottom and Top)
                if (this.y + this.radius + this.dy > canvasHeight || this.y - this.radius + this.dy < 0) {
                    this.dy = -this.dy * friction;
                    // Keep ball within bounds
                    if (this.y + this.radius >= canvasHeight) {
                        this.y = canvasHeight - this.radius;
                        // Apply ground friction to horizontal movement when rolling
                        this.dx *= 0.98; 
                    }
                    if (this.y - this.radius <= 0) this.y = this.radius;
                }

                // Move ball
                this.x += this.dx;
                this.y += this.dy;

                this.draw();
            }
        }

        function randomColor() {
            if (currentThemeColors && currentThemeColors.length > 0) {
                return currentThemeColors[Math.floor(Math.random() * currentThemeColors.length)];
            }
            
            const r = Math.floor(Math.random() * 200) + 55; // Avoid too dark colors
            const g = Math.floor(Math.random() * 200) + 55;
            const b = Math.floor(Math.random() * 200) + 55;
            return `rgb(${r}, ${g}, ${b})`;
        }

        // Distance between two points
        function getDistance(x1, y1, x2, y2) {
            let xDistance = x2 - x1;
            let yDistance = y2 - y1;
            return Math.sqrt(Math.pow(xDistance, 2) + Math.pow(yDistance, 2));
        }

        // Basic elastic collision resolution
        function resolveCollision(ball1, ball2) {
            const xVelocityDiff = ball1.dx - ball2.dx;
            const yVelocityDiff = ball1.dy - ball2.dy;

            const xDist = ball2.x - ball1.x;
            const yDist = ball2.y - ball1.y;

            // Prevent accidental overlap from locking them together
            if (xVelocityDiff * xDist + yVelocityDiff * yDist >= 0) {

                // Grab angle between the two colliding balls
                const angle = -Math.atan2(ball2.y - ball1.y, ball2.x - ball1.x);

                // Mass ratios
                const m1 = ball1.mass;
                const m2 = ball2.mass;

                // Velocity before equation
                const u1 = rotate(ball1.dx, ball1.dy, angle);
                const u2 = rotate(ball2.dx, ball2.dy, angle);

                // Velocity after 1D collision equation
                const v1 = { dx: u1.dx * (m1 - m2) / (m1 + m2) + u2.dx * 2 * m2 / (m1 + m2), dy: u1.dy };
                const v2 = { dx: u2.dx * (m1 - m2) / (m1 + m2) + u1.dx * 2 * m2 / (m1 + m2), dy: u2.dy };

                // Final velocity after rotating axis back to original location
                const vFinal1 = rotate(v1.dx, v1.dy, -angle);
                const vFinal2 = rotate(v2.dx, v2.dy, -angle);

                // Swap velocities for realistic bounce and apply friction
                ball1.dx = vFinal1.dx * friction;
                ball1.dy = vFinal1.dy * friction;
                ball2.dx = vFinal2.dx * friction;
                ball2.dy = vFinal2.dy * friction;
            }
        }

        // Helper to rotate coordinate system
        function rotate(dx, dy, angle) {
            return {
                dx: dx * Math.cos(angle) - dy * Math.sin(angle),
                dy: dx * Math.sin(angle) + dy * Math.cos(angle)
            };
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init(); // Re-initialize when resized to keep balls in bounds
        }

        window.addEventListener('resize', resizeCanvas);

        function init() {
            balls = [];
            for (let i = 0; i < numBalls; i++) {
                let radius = Math.random() * 15 + 5; // Radius between 5 and 20
                let x = Math.random() * (canvas.width - radius * 2) + radius;
                let y = Math.random() * (canvas.height - radius * 2) + radius;
                
                // Ensure they don't spawn overlapping
                if (i !== 0) {
                    for (let j = 0; j < balls.length; j++) {
                        if (getDistance(x, y, balls[j].x, balls[j].y) - radius - balls[j].radius < 0) {
                            x = Math.random() * (canvas.width - radius * 2) + radius;
                            y = Math.random() * (canvas.height - radius * 2) + radius;
                            j = -1; // Restart check
                        }
                    }
                }
                
                let color = randomColor();
                // Random velocity between -12 and 12 (increased for more energy)
                let dx = (Math.random() - 0.5) * 12; 
                let dy = (Math.random() - 0.5) * 12;

                balls.push(new Ball(x, y, radius, color, dx, dy));
            }
        }

        function animate(timestamp) {
            animationId = requestAnimationFrame(animate);
            
            // Calculate FPS
            if (timestamp - lastTime >= 1000) {
                lastTime = timestamp;
            } else {
                fpsCounter.textContent = Math.round(1000 / (timestamp - lastTime));
                lastTime = timestamp;
            }

            // Clear canvas, leaving a slight trail effect
            ctx.fillStyle = 'rgba(26, 26, 26, 0.4)'; // Semi-transparent clear
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Poetry if available
            if (currentPoetry) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = '30px "Segoe UI", Tahoma, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Split poetry by newlines to render multiline text
                const lines = currentPoetry.split('\n');
                let yOffset = canvas.height / 2 - (lines.length * 35) / 2;
                
                lines.forEach(line => {
                    ctx.fillText(line, canvas.width / 2, yOffset);
                    yOffset += 40;
                });
            }

            // Update and draw all balls
            for (let i = 0; i < balls.length; i++) {
                balls[i].update(canvas.width, canvas.height);
            }

            // Check collisions between balls
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    if (getDistance(balls[i].x, balls[i].y, balls[j].x, balls[j].y) - balls[i].radius - balls[j].radius <= 0) {
                        resolveCollision(balls[i], balls[j]);
                    }
                }
            }
        }

        // Control Event Listeners
        document.getElementById('ballCount').addEventListener('input', function(e) {
            numBalls = parseInt(e.target.value);
            document.getElementById('ballCountDisplay').textContent = numBalls;
        });

        document.getElementById('gravity').addEventListener('input', function(e) {
            gravity = parseFloat(e.target.value);
            document.getElementById('gravityDisplay').textContent = gravity;
        });

        document.getElementById('friction').addEventListener('input', function(e) {
            friction = parseFloat(e.target.value);
            document.getElementById('frictionDisplay').textContent = friction;
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            cancelAnimationFrame(animationId);
            init();
            animate(0);
        });

        document.getElementById('chaosBtn').addEventListener('click', async function() {
            const statusDiv = document.getElementById('aiStatus');
            statusDiv.style.display = 'block';
            statusDiv.textContent = 'Contacting AI for Chaos...';
            this.disabled = true;

            try {
                const prompt = "Act as a chaotic physics simulator. Generate a random, crazy set of physics parameters for a bouncing ball simulation. Return ONLY a valid JSON object with the following keys and constraints: 'gravity' (a float between -2.0 and 2.0), 'friction' (a float between 0.5 and 1.1), and 'speedMultiplier' (a float between 0.1 and 5.0). Do not include any markdown formatting or extra text.";
                
                const apiKey = ""; // Canvas provides this automatically
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0) {
                    const jsonText = result.candidates[0].content.parts[0].text;
                    const chaoticParams = JSON.parse(jsonText);
                    
                    // Apply the chaotic parameters
                    gravity = chaoticParams.gravity;
                    friction = chaoticParams.friction;
                    
                    // Update UI sliders to match the chaos
                    document.getElementById('gravity').value = gravity;
                    document.getElementById('gravityDisplay').textContent = gravity.toFixed(2);
                    document.getElementById('friction').value = friction;
                    document.getElementById('frictionDisplay').textContent = friction.toFixed(2);

                    // Re-initialize balls with the speed multiplier
                    cancelAnimationFrame(animationId);
                    balls = [];
                    for (let i = 0; i < numBalls; i++) {
                        let radius = Math.random() * 15 + 5;
                        let x = Math.random() * (canvas.width - radius * 2) + radius;
                        let y = Math.random() * (canvas.height - radius * 2) + radius;
                        let color = randomColor();
                        // Apply speed multiplier to initial velocity
                        let dx = (Math.random() - 0.5) * 8 * chaoticParams.speedMultiplier; 
                        let dy = (Math.random() - 0.5) * 8 * chaoticParams.speedMultiplier;

                        balls.push(new Ball(x, y, radius, color, dx, dy));
                    }
                    
                    statusDiv.textContent = `Chaos Applied! G:${gravity.toFixed(2)}, F:${friction.toFixed(2)}, Spd:x${chaoticParams.speedMultiplier.toFixed(1)}`;
                    animate(0);
                    
                    setTimeout(() => { statusDiv.style.display = 'none'; }, 5000);
                } else {
                    statusDiv.textContent = 'AI failed to generate chaos.';
                }
            } catch (error) {
                console.error("AI Error:", error);
                statusDiv.textContent = 'Error contacting AI.';
            } finally {
                this.disabled = false;
            }
        });

        document.getElementById('themeBtn').addEventListener('click', async function() {
            const promptInput = document.getElementById('themePrompt').value;
            if (!promptInput.trim()) return;

            const statusDiv = document.getElementById('aiStatus');
            statusDiv.style.display = 'block';
            statusDiv.textContent = 'Generating color theme...';
            this.disabled = true;

            try {
                const prompt = `Act as a color designer. Generate a palette of exactly 5 colors that match the following theme description: "${promptInput}". Return ONLY a valid JSON array of 5 valid CSS hex color strings (e.g., ["#FF0000", "#00FF00", ...]). Do not include any other text or markdown formatting.`;
                
                const apiKey = ""; // Canvas provides this automatically
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0) {
                    const jsonText = result.candidates[0].content.parts[0].text;
                    const colors = JSON.parse(jsonText);
                    
                    if (Array.isArray(colors) && colors.length > 0) {
                        currentThemeColors = colors;
                        // Apply new colors to existing balls
                        balls.forEach(ball => {
                            ball.color = randomColor();
                        });
                        statusDiv.textContent = `Theme '${promptInput}' Applied!`;
                    } else {
                        statusDiv.textContent = 'Failed to parse colors.';
                    }
                } else {
                    statusDiv.textContent = 'AI failed to generate theme.';
                }
            } catch (error) {
                console.error("AI Error:", error);
                statusDiv.textContent = 'Error generating theme.';
            } finally {
                this.disabled = false;
                setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
            }
        });

        document.getElementById('poetryBtn').addEventListener('click', async function() {
            const statusDiv = document.getElementById('aiStatus');
            statusDiv.style.display = 'block';
            statusDiv.textContent = 'Summoning AI Poet...';
            this.disabled = true;

            try {
                const prompt = "Write a short, beautiful, and slightly abstract haiku about bouncing spheres of light colliding in the darkness. Do not include any extra formatting or text, just the three lines of the haiku.";
                
                const apiKey = ""; // Canvas provides this automatically
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0) {
                    currentPoetry = result.candidates[0].content.parts[0].text.trim();
                    statusDiv.textContent = 'Poetry Generated!';
                } else {
                    statusDiv.textContent = 'AI ran out of inspiration.';
                }
            } catch (error) {
                console.error("AI Error:", error);
                statusDiv.textContent = 'Error contacting AI Poet.';
            } finally {
                this.disabled = false;
                setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
            }
        });

        // Start everything
        resizeCanvas();
        animate(0);

    </script>
</body>
</html>
